name: kakudo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kakudo
      POSTGRES_USER: kakudo
      POSTGRES_PASSWORD: kakudo
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakudo -d kakudo"]
      interval: 2s
      timeout: 5s
      retries: 30
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: kakudo_test
      POSTGRES_USER: kakudo
      POSTGRES_PASSWORD: kakudo
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakudo -d kakudo_test"]
      interval: 2s
      timeout: 5s
      retries: 30
